# Construit les versions Mac de Grimoire Boss et Grimoire Compagnon (Apple Silicon et Intel) sur des Mac de GitHub.
# Onglet Actions > « Version Mac » > Run workflow. Les .dmg sont dans le résumé du run (section Artifacts).
name: Version Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]   # Apple Silicon (arm64), Intel (x86_64)
        app:
          - name: grimoire-boss
            dir: GrimoireBoss-Source/desktop
          - name: grimoire-compagnon
            dir: Grimoirecompagnon-Source/desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire
        run: sh ${{ matrix.app.dir }}/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-mac-${{ runner.arch }}
          path: ${{ matrix.app.dir }}/dist/*.dmg
          if-no-files-found: error
